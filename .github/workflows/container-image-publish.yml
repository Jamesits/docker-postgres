name: "Container Image Publish"

permissions:
  contents: read

on:
  push:
    branches:
      - trunk
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            git.launchpad.net:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443
            deb.debian.org:80
            deb.debian.org:443

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: docker.io/jamesits/postgres
          tags: |
            type=edge,branch=trunk
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=docker.io/jamesits/postgres:github-actions-cache
          cache-to: type=registry,ref=docker.io/jamesits/postgres:github-actions-cache,mode=max,compression=zstd
