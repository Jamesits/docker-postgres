name: "Container Image Validation"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            git.launchpad.net:443
            release-assets.githubusercontent.com:443
            github.com:443
            deb.debian.org:80
            deb.debian.org:443

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: postgres:ci-smoke
          cache-from: type=registry,ref=docker.io/jamesits/postgres:github-actions-cache

      # - name: Smoke test container image
      #   run: ./scripts/container-smoke-test.sh postgres:ci-smoke
