name: "Container Image Validation"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            git.launchpad.net:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443
            deb.debian.org:80
            deb.debian.org:443
            apt.postgresql.org:80
            apt.postgresql.org:443

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: postgres:ci-smoke
          cache-from: type=registry,ref=docker.io/jamesits/postgres:github-actions-cache

      # - name: Smoke test container image
      #   run: ./scripts/container-smoke-test.sh postgres:ci-smoke
